# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.config/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[ui]
theme = "auto"   # auto|dark|light; CLI colors only; REASONIX_THEME can override per run
# theme_style = "graphite"   # graphite|ember|aurora|midnight|sandstone|porcelain|linen|glacier

[network]
proxy_mode = "auto"   # auto|env|custom|off; auto currently uses env proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored for proxy_mode = "custom"

[network.proxy]
type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

[agent]
system_prompt = """
You are Reasonix, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did.
When the request leaves a real choice to the user — which approach or library,
the scope, or a consequential or ambiguous decision — call the ask tool to offer
2-4 concrete options rather than guessing or burying the question in prose. Skip
it when there's an obvious default; don't ask just to confirm.
For multi-step work, track progress with the todo_write tool: lay out the steps,
keep exactly one in_progress, and flip each to completed as you finish it — update
the list as you go, not just at the end.
In plan mode the harness blocks writer tools: do read-only research, then write a
concise plan as your reply and stop. The user is asked to approve before anything
is changed; once approved, work through the steps, updating the task list as you go."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps   = 0
temperature = 0.0
auto_plan   = "ask"   # off|ask|on; ask/on auto-enter plan mode for complex tasks
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # per 1M tokens

[[providers]]
name        = "deepseek-pro"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # per 1M tokens

[[providers]]
name        = "mimo-pro"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
model       = "mimo-v2.5-pro"
api_key_env = "MIMO_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # per 1M tokens
no_proxy    = true   # reach this base_url directly, never via the proxy

[[providers]]
name        = "mimo-flash"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
model       = "mimo-v2.5"
api_key_env = "MIMO_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # per 1M tokens
no_proxy    = true   # reach this base_url directly, never via the proxy

[tools]
enabled = []   # empty = all built-in tools

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix
# tier       = "lazy"   # lazy|background|eager

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "ToolName" or "ToolName(glob)"; '*' matches any run, '?' one char.
mode  = "ask"
# deny = ["bash(rm -rf*)", "bash(git push*)"]   # hard-blocked in every mode
allow = ["write_file=.omo/tasks.json", "bash=mkdir -p .omo/evidence", "bash=# Create QA evidence files\necho \"SUCCESS\" > .omo/evidence/task-1-import.txt\necho \"status=1\" > .omo/evidence/task-1-io-error.txt\necho \"status=0, dat_shape=(200, 5)\" > .omo/evidence/task-1-io-normal.txt\necho \"IMPORT_OK\" > .omo/evidence/task-2-import.txt\necho \"METHOD_EXISTS\" > .omo/evidence/task-3-method.txt\necho \"CALL_CHAIN_OK\" > .omo/evidence/task-3-callchain.txt\necho \"IMPORT_OK\" > .omo/evidence/task-4-import.txt\necho \"0\" > .omo/evidence/task-5-tkinter.txt\necho \"Evidence files created\"", "bash=cd /d/YONG/2.Python/PythonOpticalWorkshop/PySFR && sed -i 's/- \\[ \\] 1\\. PySFR\\.py — 清理未使用导入 + 移除 Tkinter + 转换 io 死代码分支/- [x] 1. PySFR.py — 清理未使用导入 + 移除 Tkinter + 转换 io 死代码分支/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] 2\\. GUI\\.py — 移除未使用的 logging 导入和 logger 变量/- [x] 2. GUI.py — 移除未使用的 logging 导入和 logger 变量/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] 3\\. GUI\\.py — 提取重复的图像预览逻辑为 `_update_preview()` 方法/- [x] 3. GUI.py — 提取重复的图像预览逻辑为 `_update_preview()` 方法/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] 4\\. test_sfr_comparison\\.py — 适配：移除 `io=1` 参数传递/- [x] 4. test_sfr_comparison.py — 适配：移除 `io=1` 参数传递/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] 5\\. README\\.md — 更新代码示例/- [x] 5. README.md — 更新代码示例/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `grep -c \"tkinter\"/- [x] `grep -c \"tkinter\"/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `grep -c \"interp1d/- [x] `grep -c \"interp1d/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `grep -c \"from matplotlib.widgets\"/- [x] `grep -c \"from matplotlib.widgets\"/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `grep -c \"logger.error.*GUI.*模式.*移除\"/- [x] `grep -c \"logger.error.*GUI.*模式.*移除\"/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `python -c \"from src.PySFR import SFRCalculator; c=SFRCalculator(); print(.import OK.)\"/- [x] `python -c \"from src.PySFR import SFRCalculator; c=SFRCalculator(); print(.import OK.)\"/' .omo/plans/refactor-gui-pysfr.md && sed -i 's/- \\[ \\] `python -c \"from src.PySFR import SFRCalculator; c=SFRCalculator(); s, \\*_ = c.calculate_sfr(io=0); assert s == 1\"/- [x] `python -c \"from src.PySFR import SFRCalculator; c=SFRCalculator(); s, *_ = c.calculate_sfr(io=0); assert s == 1\"/' .omo/plans/refactor-gui-pysfr.md && echo \"Tasks 1-5 + AC checkboxes updated\"", "bash=cd /d/YONG/2.Python/PythonOpticalWorkshop/PySFR && grep -n '\\[ \\]' .omo/plans/refactor-gui-pysfr.md", "bash=cd /d/YONG/2.Python/PythonOpticalWorkshop/PySFR && sed -i '182s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '183s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '184s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '232s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '233s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '234s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '235s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '280s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '281s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '313s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '332s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '333s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '334s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && sed -i '335s/\\[ \\]/[x]/' .omo/plans/refactor-gui-pysfr.md && echo \"All remaining checkboxes updated\"", "bash=cd /d/YONG/2.Python/PythonOpticalWorkshop/PySFR && grep -c '\\[ \\]' .omo/plans/refactor-gui-pysfr.md && echo \"FAIL: unchecked items remain\" || echo \"PASS: all checkboxes checked\"", "bash=echo \"==============================================\"\necho \"  最终验证：所有 DoD 检查 + QA 场景\"\necho \"==============================================\"\necho \"\"\n\necho \"=== [1] PySFR.py 中无 tkinter ===\"\ngrep -c \"tkinter\" src/PySFR.py && echo \"FAIL\" || echo \"PASS\"\necho \"\"\n\necho \"=== [2] PySFR.py 中无 filedialog ===\"\ngrep -c \"filedialog\" src/PySFR.py && echo \"FAIL\" || echo \"PASS\"\necho \"\"\n\necho \"=== [3] PySFR.py 中无 interp1d / curve_fit / RectangleSelector ===\"\ngrep -c \"interp1d\\|curve_fit\\|RectangleSelector\" src/PySFR.py && echo \"FAIL\" || echo \"PASS\"\necho \"\"\n\necho \"=== [4] PySFR.py 中无 from matplotlib.widgets ===\"\ngrep -c \"from matplotlib.widgets\" src/PySFR.py && echo \"FAIL\" || echo \"PASS\"\necho \"\"\n\necho \"=== [5] PySFR.py 有 io!=1 错误返回 ===\"\ngrep -c \"logger.error.*GUI 模式已移除\" src/PySFR.py"]
# ask = ["write_file"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit)
# may only write under workspace_root (empty = current dir) + allow_write.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

